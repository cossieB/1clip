services:
  redis:
    image: redis:8-alpine
    ports:
      - "6378:6379"

  pg:
    image: postgres:18-alpine
    ports:
      - "2345:5432"
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=user
      - POSTGRES_DB=tests
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tests"]
      interval: 3s
      timeout: 3s
      retries: 5
